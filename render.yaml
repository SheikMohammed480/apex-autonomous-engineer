services:
  - type: web
    name: apex-autonomous-engineer
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: gemini-3.5-flash
      - key: REQUIRE_SHELL_APPROVAL
        value: "false"
