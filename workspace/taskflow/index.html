<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Project & Kanban Suite</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Header Bar -->
  <header class="navbar">
    <div class="logo">
      <i class="fa-solid fa-layer-group"></i>
      <span>TaskFlow</span>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search tasks by title, tag, or desc...">
    </div>

    <div class="filter-pills">
      <button class="pill active" data-filter="all">All</button>
      <button class="pill urgent" data-filter="urgent">Urgent</button>
      <button class="pill high" data-filter="high">High</button>
      <button class="pill medium" data-filter="medium">Medium</button>
      <button class="pill low" data-filter="low">Low</button>
    </div>

    <div class="actions">
      <button id="openNewTaskModalBtn" class="btn btn-primary">
        <i class="fa-solid fa-plus"></i> New Task
      </button>
      <button id="exportBtn" class="btn btn-secondary" title="Export JSON">
        <i class="fa-solid fa-download"></i>
      </button>
    </div>
  </header>

  <!-- Metrics Bar -->
  <section class="metrics-bar">
    <div class="metric-item">
      <span class="metric-label">Total Tasks</span>
      <span class="metric-val" id="totalTasksCount">0</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">In Progress</span>
      <span class="metric-val text-blue" id="inProgressCount">0</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">Completed</span>
      <span class="metric-val text-green" id="completedCount">0</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">Progress Rate</span>
      <div class="progress-container">
        <div class="progress-bar-fill" id="overallProgressBar" style="width: 0%"></div>
      </div>
      <span class="metric-percent" id="progressPercent">0%</span>
    </div>
  </section>

  <!-- Kanban Board -->
  <main class="kanban-board">
    <!-- Backlog Column -->
    <div class="column" data-column="backlog">
      <div class="column-header">
        <div class="title-group">
          <span class="col-dot dot-gray"></span>
          <h3>Backlog</h3>
        </div>
        <span class="badge" id="count-backlog">0</span>
      </div>
      <div class="cards-container" id="cards-backlog"></div>
    </div>

    <!-- In Progress Column -->
    <div class="column" data-column="in_progress">
      <div class="column-header">
        <div class="title-group">
          <span class="col-dot dot-blue"></span>
          <h3>In Progress</h3>
        </div>
        <span class="badge" id="count-in_progress">0</span>
      </div>
      <div class="cards-container" id="cards-in_progress"></div>
    </div>

    <!-- Review Column -->
    <div class="column" data-column="review">
      <div class="column-header">
        <div class="title-group">
          <span class="col-dot dot-purple"></span>
          <h3>Review</h3>
        </div>
        <span class="badge" id="count-review">0</span>
      </div>
      <div class="cards-container" id="cards-review"></div>
    </div>

    <!-- Done Column -->
    <div class="column" data-column="done">
      <div class="column-header">
        <div class="title-group">
          <span class="col-dot dot-green"></span>
          <h3>Done</h3>
        </div>
        <span class="badge" id="count-done">0</span>
      </div>
      <div class="cards-container" id="cards-done"></div>
    </div>
  </main>

  <!-- Create/Edit Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Create New Task</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        
        <div class="form-group">
          <label for="taskTitle">Task Title *</label>
          <input type="text" id="taskTitle" required placeholder="e.g. Implement OAuth Flow">
        </div>

        <div class="form-group">
          <label for="taskDesc">Description</label>
          <textarea id="taskDesc" rows="3" placeholder="Provide background or technical details..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group half">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <div class="form-group half">
            <label for="taskColumn">Status Column</label>
            <select id="taskColumn">
              <option value="backlog">Backlog</option>
              <option value="in_progress">In Progress</option>
              <option value="review">Review</option>
              <option value="done">Done</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="taskDueDate">Due Date</label>
          <input type="date" id="taskDueDate">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
