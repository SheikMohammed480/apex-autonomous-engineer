<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Counter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Modern Counter</h1>
    <div class="counter-display" id="counter-value">0</div>
    <div class="button-group">
      <button id="increment" class="btn primary">Increment</button>
      <button id="decrement" class="btn secondary">Decrement</button>
      <button id="reset" class="btn danger">Reset</button>
      <button id="theme-toggle" class="btn secondary">Toggle Dark Mode</button>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
