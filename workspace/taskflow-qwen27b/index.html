<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TaskFlow - A modern Kanban board for organizing your work." />
  <title>TaskFlow — Kanban Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===================== HEADER ===================== -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="18" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="11" rx="1.5"></rect>
          </svg>
        </span>
        <h1 class="app-title">TaskFlow</h1>
      </div>
    </div>

    <div class="header-center">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search tasks by title or description…"
          autocomplete="off"
          aria-label="Search tasks"
        />
      </div>
    </div>

    <div class="header-right">
      <div class="priority-filters" role="group" aria-label="Filter by priority">
        <button class="filter-btn active" data-priority="all" type="button">All</button>
        <button class="filter-btn" data-priority="High" type="button">High</button>
        <button class="filter-btn" data-priority="Medium" type="button">Medium</button>
        <button class="filter-btn" data-priority="Low" type="button">Low</button>
      </div>
      <button id="new-task-btn" class="btn btn-primary" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        New Task
      </button>
    </div>
  </header>

  <!-- ===================== STATS BAR ===================== -->
  <section class="stats-bar" aria-label="Board statistics">
    <div class="stat-card">
      <span class="stat-value" id="stat-total">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-backlog">0</span>
      <span class="stat-label">Backlog</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-inprogress">0</span>
      <span class="stat-label">In Progress</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-review">0</span>
      <span class="stat-label">Review</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-done">0</span>
      <span class="stat-label">Done</span>
    </div>
  </section>

  <!-- ===================== KANBAN BOARD ===================== -->
  <main class="board" id="board">
    <!-- Backlog -->
    <section class="column" data-status="backlog">
      <header class="column-header">
        <span class="column-dot dot-backlog"></span>
        <h2 class="column-title">Backlog</h2>
        <span class="column-count" id="count-backlog">0</span>
      </header>
      <div class="card-container" id="col-backlog" data-status="backlog" aria-label="Backlog cards"></div>
    </section>

    <!-- In Progress -->
    <section class="column" data-status="inprogress">
      <header class="column-header">
        <span class="column-dot dot-inprogress"></span>
        <h2 class="column-title">In Progress</h2>
        <span class="column-count" id="count-inprogress">0</span>
      </header>
      <div class="card-container" id="col-inprogress" data-status="inprogress" aria-label="In Progress cards"></div>
    </section>

    <!-- Review -->
    <section class="column" data-status="review">
      <header class="column-header">
        <span class="column-dot dot-review"></span>
        <h2 class="column-title">Review</h2>
        <span class="column-count" id="count-review">0</span>
      </header>
      <div class="card-container" id="col-review" data-status="review" aria-label="Review cards"></div>
    </section>

    <!-- Done -->
    <section class="column" data-status="done">
      <header class="column-header">
        <span class="column-dot dot-done"></span>
        <h2 class="column-title">Done</h2>
        <span class="column-count" id="count-done">0</span>
      </header>
      <div class="card-container" id="col-done" data-status="done" aria-label="Done cards"></div>
    </section>
  </main>

  <!-- ===================== TASK MODAL ===================== -->
  <div class="modal-backdrop" id="task-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <h2 id="modal-title" class="modal-title">New Task</h2>
        <button class="modal-close" id="modal-close" type="button" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <form id="task-form" class="modal-body" novalidate>
        <input type="hidden" id="task-id" value="" />

        <div class="form-group">
          <label for="task-title">Title <span class="req">*</span></label>
          <input type="text" id="task-title" name="title" required maxlength="120" placeholder="e.g. Design landing page hero" />
          <p class="field-error" id="error-title" hidden>Please enter a title.</p>
        </div>

        <div class="form-group">
          <label for="task-desc">Description</label>
          <textarea id="task-desc" name="description" rows="4" maxlength="600" placeholder="Add more details…"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority" name="priority">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-due">Due Date</label>
            <input type="date" id="task-due" name="dueDate" />
          </div>
        </div>

        <div class="form-group">
          <label for="task-status">Status</label>
          <select id="task-status" name="status">
            <opt
